# Host-testable crates only. `firmware/` is its own workspace (xtensa target, esp toolchain).
[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["firmware"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
heapless = { version = "0.7", features = ["serde"] }
walpad-protocol = { path = "crates/protocol", default-features = false }
walpad-core = { path = "crates/core", default-features = false }
